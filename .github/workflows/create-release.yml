on:
  pull_request:
    types:
      - closed
    branches:
      - main

name: Create Release

jobs:
  github-release:
    name: Github Release
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'releases/') && github.event.pull_request.head.repo.full_name == 'cloudflare/workers-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          NOTES: ${{ github.event.pull_request.body }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          VERSION=${BRANCH#releases/}
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$SHA" \
            --title "Release $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
