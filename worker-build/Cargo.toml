[package]
authors = ["Cloudflare Workers Team <workers@cloudflare.com>"]
edition = "2021"
rust-version.workspace = true
name = "worker-build"
version = "0.8.7"
license = "Apache-2.0"
repository = "https://github.com/cloudflare/workers-rs/tree/main/worker-build"
readme = "README.md"
description = "This is a tool to be used as a custom build command for a Cloudflare Workers `workers-rs` project."

[dependencies]
anyhow = "1.0.98"
binary-install = "0.4.1"
diffy = "0.5"
cargo_metadata = "0.23.1"
clap = { version = "4.5", features = ['derive'] }
console = "0.16.0"
dirs-next = "2.0"
env_logger = "0.11.8"
filetime = "0.2"
flate2 = "1.1"
glob = "0.3.1"
heck = "0.5.0"
log = "0.4.17"
parking_lot = "0.12.1"
path-clean = "1.0.1"
rolldown = "=1.2.14"
semver = "1.0.26"
serde = "1.0.219"
serde_ignored = "0.1.12"
serde_json = "1.0.143"
strsim = "0.11.1"
tar = "0.4"
tokio = { version = "1.52.3", default-features = false, features = ["rt"] }
toml = "1.1.4"
ureq = { version = "3.1", features = ["gzip", "json", "native-tls"] }
which = "8.0.0"
worker-codegen.workspace = true

# Rolldown and oxc release their crates in lockstep and break APIs between patch
# releases, while depending on each other with caret requirements. Pin every
# crate in each family so `cargo install worker-build` without `--locked`
# resolves the same set we build and test against. Bump them together.
oxc = "=0.154.0"
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_ast_macros = "=0.154.0"
oxc_ast_visit = "=0.154.0"
oxc_codegen = "=0.154.0"
oxc_compat = "=0.154.0"
oxc_data_structures = "=0.154.0"
oxc_diagnostics = "=0.154.0"
oxc_ecmascript = "=0.154.0"
oxc_estree = "=0.154.0"
oxc_isolated_declarations = "=0.154.0"
oxc_mangler = "=0.154.0"
oxc_minifier = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_regular_expression = "=0.154.0"
oxc_semantic = "=0.154.0"
oxc_span = "=0.154.0"
oxc_str = "=0.154.0"
oxc_syntax = "=0.154.0"
oxc_transformer = "=0.154.0"
oxc_transformer_plugins = "=0.154.0"
oxc_traverse = "=0.154.0"
rolldown_common = "=1.2.14"
rolldown_dev_common = "=1.2.14"
rolldown_devtools = "=1.2.14"
rolldown_devtools_action = "=1.2.14"
rolldown_ecmascript = "=1.2.14"
rolldown_ecmascript_utils = "=1.2.14"
rolldown_error = "=1.2.14"
rolldown_fs = "=1.2.14"
rolldown_plugin = "=1.2.14"
rolldown_plugin_asset_module = "=1.2.14"
rolldown_plugin_chunk_import_map = "=1.2.14"
rolldown_plugin_copy_module = "=1.2.14"
rolldown_plugin_data_url = "=1.2.14"
rolldown_plugin_hmr = "=1.2.14"
rolldown_plugin_lazy_compilation = "=1.2.14"
rolldown_plugin_oxc_runtime = "=1.2.14"
rolldown_plugin_utils = "=1.2.14"
rolldown_resolver = "=1.2.14"
rolldown_sourcemap = "=1.2.14"
rolldown_std_utils = "=1.2.14"
rolldown_tracing = "=1.2.14"
rolldown_utils = "=1.2.14"
string_wizard = "=1.2.14"

[dev-dependencies]
wasm-bindgen-cli-support.workspace = true

[[bin]]
name = "worker-codegen"
