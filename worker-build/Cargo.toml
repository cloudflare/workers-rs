[package]
authors = ["Cloudflare Workers Team <workers@cloudflare.com>"]
edition = "2021"
rust-version.workspace = true
name = "worker-build"
version = "0.9.0"
license = "Apache-2.0"
repository = "https://github.com/cloudflare/workers-rs/tree/main/worker-build"
readme = "README.md"
description = "This is a tool to be used as a custom build command for a Cloudflare Workers `workers-rs` project."

[dependencies]
anyhow = "1.0.98"
diffy = "0.5"
cargo_metadata = "0.23.1"
clap = { version = "4.5", features = ['derive'] }
console = "0.16.0"
dirs-next = "2.0"
env_logger = "0.11.8"
filetime = "0.2"
flate2 = "1.1"
heck = "0.5.0"
log = "0.4.17"
path-clean = "1.0.1"
semver = "1.0.26"
serde = "1.0.219"
serde_ignored = "0.1.12"
serde_json = "1.0.143"
strsim = "0.11.1"
tar = "0.4"
toml = "1.1.4"
ureq = { version = "3.1", features = ["gzip", "json", "native-tls"] }
which = "8.0.0"
worker-codegen.workspace = true

[dev-dependencies]
wasm-bindgen-cli-support.workspace = true

[[bin]]
name = "worker-codegen"
