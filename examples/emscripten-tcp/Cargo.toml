[package]
name = "emscripten-tcp"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.release]
release = false

[dependencies]
worker = { path = "../../worker", features = ["experimental_tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util", "time"] }
