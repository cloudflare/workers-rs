name = "emscripten-tcp"
main = "build/index.js"
compatibility_date = "2026-06-02"
# new_module_registry gives the Emscripten glue `import.meta.url`.
compatibility_flags = ["nodejs_compat", "new_module_registry"]

[build]
command = "cargo install -q worker-build && worker-build --emscripten --release"

[durable_objects]
bindings = [{ name = "PROBE", class_name = "Probe" }]

[[migrations]]
tag = "v1"
new_classes = ["Probe"]
