name = "emscripten-imagedata"
main = "build/index.js"
compatibility_date = "2026-09-02"
# new_module_registry gives the Emscripten glue `import.meta.url`.
compatibility_flags = ["new_module_registry"]

[build]
# simd128 for the Rust crates (worker-build appends RUSTFLAGS) and for the C
# side and the emcc link so Binaryen accepts the SIMD ops.
command = "cargo install -q worker-build && RUSTFLAGS=\"-Ctarget-feature=+simd128 $RUSTFLAGS\" EMCC_CFLAGS=\"-msimd128 $EMCC_CFLAGS\" worker-build --emscripten --release"
