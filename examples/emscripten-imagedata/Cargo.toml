[package]
name = "emscripten-imagedata"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: the emscripten target, beta toolchain and dependency patches
# stay out of the workspace lockfile.
[workspace]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
fast_image_resize = "6"
jpeg-encoder = { version = "0.7", features = ["simd"] }
base64-simd = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { path = "../../worker" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
